oice, not a protocol constant.","Latency is the judge's clock around each reply on a GitHub-hosted runner, including the pipe; differences below the axis tolerance are noise.","Protocol parameters change through on-chain governance; these use the documented mainnet values.","change-privacy is declared by submitters, never checked."],"flow":[{"detail":"Payments to the wallet, and withdrawn staking rewards, become UTxOs, some of them small.","label":"Funds arrive","this_challenge":false},{"detail":"One payment can have several outputs.","label":"The user asks to pay","this_challenge":false},{"detail":"Choose the inputs, the change outputs and the fee. The choice decides the transaction's size, and so its fee, and which UTxOs the wallet keeps.","label":"Coin selection","this_challenge":true},{"detail":"The fee is 44 lovelace per byte plus 155,381 lovelace; each input adds about 140 bytes.","label":"Build, sign and submit","this_challenge":false},{"detail":"Change outputs become the UTxOs the next selection chooses from.","label":"Change returns to the wallet","this_challenge":false}],"one_line":"Choose which coins a Cardano wallet spends for each payment, and what change it keeps.","sources":["CIP-2, Coin Selection Algorithms for Cardano: https://cips.cardano.org/cip/CIP-0002","Cardano protocol parameters reference guide (txFeePerByte 44, txFeeFixed 155381, utxoCostPerByte 4310, maxTxSize 16384): https://docs.cardano.org/about-cardano/explore-more/parameter-guide","Accepted results: feeds/coin-select.json on this site"],"stakes":"Every Cardano wallet runs coin selection for every payment it makes. The choice sets the fee paid now and the shape of the wallet left behind. Among the goals of CIP-2, the Cardano standard for it: limit the dust that builds up in the UTxO set, and keep outputs that let future payments be made with few inputs. It also notes that putting all change into one output is widely considered bad for privacy. These pull against each other, so there is no single best answer, only trade-offs worth mapping.","value_levers":[{"is_estimate":false,"quantity":"−91% dust for +7% fees","source":"Accept-stage medians of baseline and random-improve (feeds/coin-select.json)","statement":"random-improve leaves about 91% fewer dust UTxOs than largest-first (3.9 against 43.3 per wallet) for about 7% more fees (39.9 against 37.3 ADA over about 210 payments)."},{"is_estimate":true,"quantity":"+1 input → +6,160 lovelace (≈ +3.5% of a fee)","source":"Fee formula with the mainnet parameters; average fee = 37.25 ADA / 209.7 payments, the mean payment count over 40 generated scenarios (our calculation)","statement":"Each extra input adds 140 bytes, 6,160 lovelace at 44 lovelace per byte: about 3.5% of the average fee per payment under largest-first (about 0.178 ADA)."},{"is_estimate":true,"quantity":"sweep 43 dust UTxOs ≈ 0.43 ADA","source":"Size model: 60 + 140 × 43 + 65 = 6,145 bytes; fee 155,381 + 44 × 6,145 = 425,761 lovelace (our calculation)","statement":"On fees alone, dust is cheap to clear: sweeping largest-first's 43 dust UTxOs in one 43-input transaction costs about 0.43 ADA, against the 2.6 ADA more that random-improve pays to avoid it. Dust matters for CIP-2's other goal, keeping UTxOs that let later payments use few inputs, more than for fees."}],"why_this_instance":"Each run replays 8 wallets through 300 events: deposits (some small and reward-like, 1 to 3 ADA) and about 210 payments of one to three outputs. Wallets start with 60 to 120 UTxOs. Fees use the mainnet fee parameters with a fixed transaction-size model. Every run draws fresh wallets from a new seed, so nothing can be tuned to the inputs. The results say nothing about wallets holding native tokens, script outputs or exchange-sized UTxO sets."},"contracts":[{"admits_when":null,"choice_space":"contracts/wallet/CHOICES.md","id":"wallet@1","interface":"contracts/wallet/INTERFACE.md","status":"open"},{"admits_when":"a multi-asset size and min-ada model, checked ag aration and is never judged. new starts a direction \u003cname\u003e that no accepted submission uses. builds-on names an accepted parent; copy its directory and edit it. The direction is inherited. A port to another language, or a new name, seed or constant on an accepted approach, is builds-on, not new.","Say what you expect before it is measured. hypothesis is one sentence (at most 300 chars): what should happen and why. expected maps axes to lower, same or higher, relative to your parent (builds-on) or the baseline (new), e.g. expected = { fees = \"lower\", dust = \"higher\" }. The PR comment and the site show each prediction against the measurement, within the axis's tolerance. A refuted prediction …","Run the judge locally first (see README.md). CI then builds your submission and runs the same judge, which checks the properties and measures every axis. Those numbers are a claim from the PR run.","There is no record to beat and no minimum improvement. If the checks pass, the PR is landed on main automatically, two clean runs there record it on the map, and the PR is closed. Failing and noisy attempts are recorded too."],"summary":"Cardano wallets must choose which UTxOs to spend for each payment (CIP-2). The transaction pays a fee that grows with its size, so fewer inputs is cheaper now. But always spending the biggest coins leaves a wallet full of small leftovers (dust) that cost more to spend later, and spending many small ones now costs fees today. Cheap online heuristics answer fast; exact searches find tidier selections but take longer. There is no single winner, which is what the map on the site is for.","targets":[],"taxonomy":{"axes":[{"definition":"How inputs are chosen for a payment","id":"strategy","values":[{"count":4,"definition":"Sort by value, take the biggest UTxOs until the payment and fee are covered","id":"largest-first","proposed":false},{"count":2,"definition":"CIP-2 random-improve: pick UTxOs at random, then improve towards an ideal change ":"claims 1.0106992674008914 vs record 1.000012450031894; promotion decides","record_before":1.000012450031894,"stage":"pr","status":"valid_claim_better","value":1.0106992674008914},{"at":"2026-11-12T11:39:38Z","by":"Ryun1","commit":"68e6d8eadcc9e1bdb824cf0d6f066ce6f94a26ba","diff":null,"model":"","reason":"a run failed for infrastructure reasons","record_before":1.000012450031894,"stage":"promotion","status":"infra_failed","value":1.0163719717256252},{"at":"2026-11-11T18:52:54Z","by":"Ryun1","commit":"e8d100ec33458bc1c039862f2cf79c9841e5e230","diff":"diffs/ledger-cbor/e8d100ec33458bc1c039862f2cf79c9841e5e230.patch","model":"","reason":"claims 1.0134128137894802 vs record 1.000012450031894; promotion decides","record_before":1.000012450031894,"stage":"pr","status":"valid_claim_better","value":1.0134128137894802},{"at":"2026-11-11T17:38:25Z","by":"Ryun1","commit":"996a92bf310a279a33d4ea821956a75a4149a9c6","diff":null,"model":"","reason":"","record_before":null,"stage":"baseline","status":"baseline","value":1.000012450031894}],"baseline":{"at":"2026-11-11T17:38:25Z","value":1.000012450031894},"board":[{"at":"2026-11-20T14:16:42Z","commit":"def74674377878f0d06ebfb222540b8f5e954fbf","delta_pct":56.77,"model":"","rank":1,"solver":"Ryun1","value":1.5677011091813022},{"at":"2026-11-19T18:43:12Z","commit":"eb4318645592a69d7e4393078568b9e1a0f5f837","delta_pct":40.02,"model":"","rank":2,"solver":"Ryun1","value":1.4002637165382688},{"at":"2026-11-16T00:24:32Z","commit":"80a6f2c69bdd84397003927100aab7135bbd8d1f","delta_pct":35.08,"model":"","rank":3,"solver":"Ryun1","value":1.3507871794243989},{"at":"2026-11-13T11:56:39Z","commit":"84ef7a006e0db0b1363610e52d505acc81081050","delta_pct":13.27,"model":"","rank":4,"solver":"Ryun1","value":1.1326747640764825},{"at":"2026-11-12T20:41:26Z","commit":"3bf6967fb8862eb9bd6d8e8c0464cd564133ccbf","delta_pct":1.34,"model":"","rank":5,"solver":"Ryun1","value":1.013430150878856}],"context":{"calls":{"basis":"About 4,320 blocks a day (86,400 one-second slots × activeSlotsCoeff 0.05) × about 10.9 transactions per block (1,633 in 150 uniformly sampled mainnet blocks) ≈ 47,000 transactions a day (our estimate).","source":"Ouroboros Consensus data-flow docs (mempool and block paths); mainnet Shelley genesis; this challenge's corpus","value":"Every transaction, at every node whose mempool it enters; its fields again on every node that applies its block"},"cautions":["The score counts CPU instructions under Callgrind, not wall time. A paired wall-time check only rejects a candidate whose wall-time speedup is below 0.92.","Only the mempool path is timed. A transaction in a block has a different serialization; the block decoder reuses the same field decoders (transaction bodies, outputs, values, witnesses), but its own framing is not measured.","Decoding is one part of what a node does per transaction and per block; its share of a node's CPU is not known here, so no node-level saving is claimed.","Upstream's test suites for the alonzo, babbage and conway packages are not run on promotion yet (they do not fit the runner's time limits).","pallas decodes into different structures in a different language: its instruction count shows headroom, not a target."],"flow":[{"detail":"A wallet submits the transaction to a node (local tx-submission), and nodes pass it to their peers (node-to-node TxSubmission).","label":"Submitted","this_challenge":false},{"detail":"Each node decodes the transaction's CBOR into a MempoolTx with cardano-ledger. This is the decoder this challenge makes faster.","label":"Decoded","this_challenge":true},{"detail":"The mempool validates the transaction against the current ledger state and rejects it if it is invalid.","label":"Validated and held","this_challenge":false},{"detail":"A slot leader takes transactions from its mempool into a new block.","label":"Forged into a block","this_challenge":false},{"detail":"Peers fetch the block, decode it (reusing the same field decoders for each transaction's body and witnesses) and apply it to the ledger; the mempool is then revalidated.","label":"Block applied on every node","this_challenge":false}],"one_line":"Make cardano-ledger decode Cardano transactions in fewer CPU instructions, without changing what it accepts.","sources":["cardano-ledger @ 7827506, libs/cardano-ledger-core/src/Cardano/Ledger/MempoolTx/Internal.hs: MempoolTx is 'a top-level transaction as it is received by the mempool'; mempool and block transactions do not share a serialization","cardano-ledger @ 7827506, eras/alonzo/impl/src/Cardano/Ledger/Alonzo/BlockBody/Internal.hs and eras/conway/impl/src/Cardano/Ledger/Conway/BlockBody.hs (BlockBody ConwayEra = AlonzoBlockBody ConwayEra): block bodies decode transaction bodies and witnesses with the same decoders","Ouroboros Consensus, Components' Data Flow: https://ouroboros-consensus.cardano.intersectmbo.org/docs/explanations/data_flow","Mainnet Shelley genesis (activeSlotsCoeff 0.05, slotLength 1): https://book.world.dev.cardano.org/environments/mainnet/shelley-genesis.json","This challenge's corpus: 1,633 transactions from 150 uniformly sampled mainnet blocks, epochs 645 to 666 (corpus/pool.json)","This challenge's measure run 42721883592 (reference profile and pallas comparison)"],"stakes":"Every Conway transaction that reaches a Cardano node arrives as CBOR bytes and is decoded by cardano-ledger before the node can validate it, and its fields are decoded again when the node applies the block that contains it. That decoder sits on consensus-critical code, so a faster decoder is only worth having if it accepts and rejects exactly the same bytes as today's. A Rust decoder decodes the same transactions in about 4.5x fewer instructions, which suggests there is room.","value_levers":[{"is_estimate":false,"quantity":"pallas: ≈ 4.5x fewer instructions","source":"This challenge's measure run 42721883592 (Callgrind, same transactions)","statement":"On the same mainnet transactions, pallas (Rust) needs about 4.5x fewer instructions than cardano-ledger's decoder, so the Haskell decoder is far from a floor. In the reference profile the editable packages run about a quarter of the instructions directly and the GHC runtime another 38%, much of it closure application and allocation that the decoders' shape decides."},{"is_estimate":false,"quantity":"same decoders on the block path","source":"cardano-ledger @ 7827506: AlonzoBlockBody's decoder (used by Conway) decodes bodies and witnesses with the same decCBOR instances","statement":"A faster field decoder (transaction bodies, outputs, values) also speeds up decoding blocks, because the block body decoder calls the same instances, though only the mempool path is measured here."}],"why_this_instance":"Each CI run decodes 800 transactions sampled from recent mainnet blocks fetched for that run (protocol version 11, Conway era) as mempool transactions: decodeFullAnnotator into MempoolTx ConwayEra, then fully evaluated. Correctness is checked against the pinned reference on every input, including truncated, bit-flipped, extended and re-tagged mutants. The results say nothing about older eras, ledger-state decoding, the block's own framing or wall time on a running node."},"direction":"maximise","editable":["candidate/"],"family":"perf","feed":"feeds/ledger-cbor.json","max_bytes":4194304,"metric":"speedup","min_improvement_bips":100,"prompt":"You are helping me contribute to the ledger-cbor challenge: make cardano-ledger decode real mainnet Conway transactions in fewer CPU instructions, without changing what it decodes or what it rejects. This is the decoder cardano-node runs on every transaction, so a decoder that accepts or rejects anything differently is a consensus bug, not a speedup. Correctness comes first: a faster decoder that differs from the reference anywhere is rejected.\n\nSetup\n- The challenge lives in the private repo github.com/Ryun1/auto-research-challenge-builder, under challenges/ledger-cbor/. I am a collaborator on it. If it is not cloned yet: git clone git@github.com:Ryun1/auto-research-challenge-builder.git\n- Before changing anything, read challenges/ledger-cbor/README.md (goal, scoring, policy) and challenges/ledger-cbor/SUBMITTING.md (the full walkthrough). They are the source of truth. If this prompt and those files disagree, follow the files and tell me.\n- Start from the latest main: git fetch origin \u0026\u0026 git switch -c \u003cmy-github-name\u003e/ledger-cbor-\u003cidea\u003e origin/main\n- Push branches to this repo. Do not fork: a pull request from a fork gets no score comment.\n\nHow it is scored\n- The score is speedup = reference instructions / candidate instructions, counted by Callgrind on a fresh sample of recent mainnet transactions that CI draws after the code is built. A paired wall-time check rejects a change that makes decoding measurably slower.\n- A change counts only if it beats the current record by at least 1%. The record and every earlier attempt are in challenges/ledger-cbor/results.jsonl: read it to see where the bar is and what has been tried.\n- Correct means identical to the reference on every input: the same decoded value, the same re-encoded bytes, the same accept or reject decision on mutated inputs, and nothing left unevaluated that the reference evaluates.\n\nWhat you may change\n- Only existing .hs files under challenges/ledger-cbor/candidate/\u003cpackage\u003e/src/. No new, deleted or renamed files, and nothing outside candidate/.\n- No new unsafe* functions, FFI, Template Haskell, CPP lines, IO or imports of GHC internals. The Policy section of the README has the exact allowlist. Everything under candidate/ must stay below 4 MiB in total.\n\nWhere to look\n- A profile of the reference shows the editable packages running about a quarter of the instructions directly (mary 9%, binary 6%, babbage, conway and alonzo 5%, core 3%) and the GHC runtime another 38%, much of it closure application and allocation that the shape of the decoders decides. A Rust decoder (pallas) needs about 4.5x fewer instructions on the same transactions, so there is room.\n- One change that scored about 1% as a pull request replaced a decode that went through the Coders interpreter (the MaryValue pair) with a direct decoder. Similar places are worth checking, but treat that as a lead, not a finding: measure.\n- Keep error behaviour and laziness exactly as they are.\n\nHow to work\n1. Pick one idea, small enough to reason about. One idea per pull request.\n2. Make the change, then run the gate. It works on macOS and Linux and needs only git and Rust:\n   cargo build --release \u0026\u0026 ./target/release/cb gate --base origin/main --head HEAD\n   It must print \"gate ok: ledger-cbor\".\n3. If this machine is Linux with GHC 9.6.7, cabal 3.16 and valgrind, build and measure locally from challenges/ledger-cbor/: ./setup.sh (35+ minutes the first time), then ./build.sh, CB_SEED=1 ./verifier/run and CB_SEED=1 ./bench/run. The build does not work on macOS: skip this step there and let CI build it.\n4. Commit, push the branch and open a pull request against main. In the description say what changed, why the decoder still accepts, rejects and evaluates exactly what it did before, and any numbers you measured.\n5. CI comments the result on the pull request, usually within tens of minutes. Read it and tell me the status and the speedup. \"valid claim better\" means it beats the record by 1% and is ready for the maintainer. \"rejected\" with \"verify failed\" means the output differs from the reference somewhere.\n\nLimits\n- Do not push to main and do not merge the pull request. The maintainer merges, and two fresh runs on main then decide whether it becomes the record.\n- Do not edit the judge, the tests, the workflows or results.jsonl.\n- Report honestly. Local numbers come from a public sample and are only a guide; the score is CI's. If an idea does not pay off, say so and show the numbers instead of tuning until it looks good.\n- Every push to a pull request costs the organisers build time, and the pipeline refuses an account's pushes after 10 in 24 hours. Measure before you push, and ask me before starting a second idea.","record":{"at":"2026-11-20T14:16:42Z","by":"Ryun1","value":1.5677011091813022},"slug":"ledger-cbor","state":"open","status":"open","submit_steps":["Branch, don't fork. You are a collaborator, so push a branch to this repo and open the PR from it against main.","What you may change","Build and test locally (Linux only). The build needs GHC 9.6.7, cabal 3.16, python3, rsync and the Cardano system libraries (libsodium, secp256k1, blst). Scoring also needs valgrind. setup.sh uses GNU sed -i, so it fails on macOS. On a Mac, edit there and build on a Linux machine, or let CI build it.","Open the PR and read the result. Opening the PR, and every later push to it, starts the Submission workflow. A new push cancels the run in progress for that PR.","After the merge. The maintainer merges PRs one at a time. The merge starts the Promote workflow on main, which takes about 20 minutes with warm caches (longer after a cold rebuild). It makes two independent runs, each on its own fresh pool and seed. Each run scores your tree and the current record's tree on the same sample, and it also builds and runs the upstream test suites of five packages (bin…"],"summary":"Make cardano-ledger decode real mainnet Conway transactions in fewer instructions, without changing what it decodes or what it rejects. The editable code is the src/ of the decoding stack: cardano-ledger-binary (the Decoder monad, Annotator, coders, primitives), cardano-ledger-core and the era packages from Shelley to Conway (the per-field instances, MaryValue, BabbageTxOut, the Conway tx body...).","targets":[{"comparable":"different","id":"pallas","label":"pallas (Rust)","note":"About 22-25k instructions per transaction against the reference's 100-110k: 4.3x to 4.7x across the pools, 3.3x to 3.5x when pallas also hashes. A different language decoding into different structures, so it shows headroom, not a bar.","source":"This challenge's measure run 42721883592: Callgrind on the same 6 transaction pools","status":"measured-here","value":4.5,"values":{},"year":null}],"title":"Cardano ledger: faster Conway CBOR decoding (cardano-ledger, Haskell)","to_beat":1.5833781202731152}],"generated_at":"2026-11-24T15:48:47Z","site_schema_version":1}</script><script src="assets/app.js"></script></body></html>
